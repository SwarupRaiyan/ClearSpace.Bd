<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111816"/>
      <stop offset="40%" style="stop-color:#1B4332"/>
      <stop offset="100%" style="stop-color:#2D6A4F"/>
    </linearGradient>
    <radialGradient id="glow1" cx="70%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#52B788;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#52B788;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="80%" r="30%">
      <stop offset="0%" style="stop-color:#D4A853;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#D4A853;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <!-- Subtle geometric pattern -->
  <line x1="0" y1="200" x2="1920" y2="200" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="0" y1="400" x2="1920" y2="400" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="0" y1="600" x2="1920" y2="600" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="0" y1="800" x2="1920" y2="800" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <!-- Large decorative circle -->
  <circle cx="1500" cy="200" r="500" fill="none" stroke="rgba(82,183,136,0.08)" stroke-width="80"/>
  <circle cx="1500" cy="200" r="350" fill="none" stroke="rgba(82,183,136,0.05)" stroke-width="2"/>
  <!-- Dots -->
  <circle cx="1700" cy="700" r="5" fill="rgba(82,183,136,0.5)"/>
  <circle cx="1740" cy="740" r="3" fill="rgba(82,183,136,0.35)"/>
  <circle cx="1660" cy="760" r="4" fill="rgba(82,183,136,0.25)"/>
  <circle cx="300" cy="200" r="3" fill="rgba(212,168,83,0.5)"/>
  <circle cx="350" cy="160" r="2" fill="rgba(212,168,83,0.35)"/>
  <!-- Brand mark -->
  <text x="1500" y="580" font-family="Georgia, serif" font-size="300" fill="rgba(255,255,255,0.02)" text-anchor="middle" dominant-baseline="middle">✦</text>
</svg>
